<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="theme-color" content="#2F8CFF">
<link rel="icon" href="../../icon-32.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ソウル旅リハーサル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed free-roam 3D; HUD (objective, wallet, minimap) on top, joystick bottom-left, action bottom-right, ticket-like sheet for talk */
:root{
  --bg:#e6ecf1;
  --card:#ffffff;
  --ink:#1b2230;
  --muted:#5b6575;
  --line:#dbe2ea;
  --soft:#f1f5f9;
  --arex:#0f67b1;
  --express:#ec6a17;
  --sign:#ffc629;
  --ok:#1d9a57;
  --miss:#d6453d;
  --shadow:0 10px 30px rgba(18,32,52,.18);
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151c;--card:#1b222d;--ink:#eef2f7;--muted:#9ba6b6;--line:#2c3644;--soft:#232c39;
    --arex:#4ea3ec;--express:#ff8a3d;--ok:#3ec27c;--miss:#ff6b62;--shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151c;--card:#1b222d;--ink:#eef2f7;--muted:#9ba6b6;--line:#2c3644;--soft:#232c39;
  --arex:#4ea3ec;--express:#ff8a3d;--ok:#3ec27c;--miss:#ff6b62;--shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:grid;gap:8px;pointer-events:none}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scene-tag{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;box-shadow:var(--shadow);min-width:0}
.scene-tag b{background:var(--arex);color:#fff;font-size:10.5px;letter-spacing:.08em;border-radius:999px;padding:4px 8px;font-weight:800;white-space:nowrap}
.scene-tag span{font-weight:800;font-size:13px;white-space:nowrap}
.hud-actions{display:flex;gap:6px;pointer-events:auto}
.pill-btn{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:999px;padding:8px 11px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.pill-btn:focus-visible,.btn:focus-visible,.choice:focus-visible,.say:focus-visible,.act-btn:focus-visible,.mbtn:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.hud-main{display:flex;gap:8px;align-items:flex-start}
.hud-left{display:grid;gap:6px;flex:1;min-width:0}
.obj{display:flex;align-items:flex-start;gap:8px;background:var(--card);border-radius:12px;padding:8px 11px;box-shadow:var(--shadow);font-size:12.5px;font-weight:800;line-height:1.4;min-width:0}
.obj em{font-style:normal;font-size:10px;color:#1b2230;background:var(--sign);border-radius:6px;padding:2px 6px;flex:none;margin-top:1px;letter-spacing:.04em}
.obj span{min-width:0}
.wallet{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:5px 9px;box-shadow:var(--shadow);font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip i{width:16px;height:11px;border-radius:2px;display:inline-block;background:linear-gradient(135deg,var(--arex),#58b6f0)}
.chip.ex i{background:linear-gradient(135deg,var(--express),#ffb27a)}
.chip.miss{color:var(--miss)}
#minimap{width:108px;height:108px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);flex:none}

/* controls */
.joy{position:absolute;left:0;bottom:0;width:48%;height:40%;touch-action:none;z-index:2}
.joy-base{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(16,28,44,.22);pointer-events:none;transition:opacity .2s}
.joy-base.idle{opacity:.55}
.joy-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.joy-label{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;font-size:10.5px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.act-btn{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:3;font:inherit;border:0;border-radius:18px;padding:12px 16px;min-width:120px;background:var(--arex);color:#fff;font-weight:800;font-size:14px;box-shadow:0 5px 0 color-mix(in srgb,var(--arex) 60%,#000),var(--shadow);cursor:pointer;display:grid;gap:1px;text-align:center;animation:pop .25s ease-out}
.act-btn small{font-size:10.5px;opacity:.85;font-weight:500}
.act-btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--arex) 60%,#000)}

/* bottom sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;pointer-events:none;z-index:5}
.sheet-inner{pointer-events:auto;width:100%;max-width:520px;max-height:62vh;overflow:auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px 18px 16px;display:grid;gap:12px;animation:rise .3s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet-inner,.act-btn,.toast{animation:none}}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--arex);text-transform:uppercase}
.sheet h2{margin:0;font-size:20px;line-height:1.3;text-wrap:balance}
.sheet p{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
.mission{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800}
.mission em{font-style:normal;color:#1b2230;background:var(--sign);border-radius:6px;padding:2px 7px;font-size:11px;letter-spacing:.04em}
.controls{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;align-items:center;margin:0}
.controls dt{font-weight:800;background:var(--soft);border-radius:8px;padding:3px 8px;text-align:center;white-space:nowrap}
.controls dd{margin:0;color:var(--muted)}

.phrase{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.phrase .ko{font-family:var(--f-ko);font-weight:700;font-size:24px;line-height:1.35;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.phrase .kana{font-size:13px;color:var(--arex);font-weight:800}
.phrase .ja{font-size:13px;color:var(--muted)}
.phrase.small .ko{font-size:18px}
.say{font:inherit;font-size:11px;font-weight:800;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer;flex:none}
.tip{font-size:13px;line-height:1.7;color:var(--muted);display:flex;gap:8px}
.tip::before{content:"";flex:none;width:6px;border-radius:3px;background:var(--sign)}

.speaker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted)}
.speaker i{width:24px;height:24px;border-radius:50%;background:var(--arex);display:inline-block;position:relative}
.speaker i::after{content:"";position:absolute;left:6px;top:5px;width:12px;height:12px;border-radius:50%;background:#f3caa6}
.bubble{background:var(--soft);border-radius:4px 16px 16px 16px;padding:12px 14px;display:grid;gap:2px}
.bubble.miss{background:color-mix(in srgb,var(--miss) 12%,var(--card))}
.bubble .ko{font-family:var(--f-ko);font-weight:700;font-size:20px;line-height:1.4;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bubble .kana{font-size:12.5px;color:var(--arex);font-weight:800}
.bubble .ja{font-size:12.5px;color:var(--muted)}
.choices{display:grid;gap:8px}
.choice{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;cursor:pointer;display:grid;gap:1px;transition:border-color .15s,transform .15s}
.choice:hover{border-color:var(--arex)}
.choice:active{transform:scale(.98)}
.choice .ko{font-family:var(--f-ko);font-weight:700;font-size:18px}
.choice .kana{font-size:12px;color:var(--arex);font-weight:800}
.choice .ja{font-size:12px;color:var(--muted)}
.choice.wrong{border-color:var(--miss);opacity:.55}
.hint{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.hint input{width:18px;height:18px;accent-color:var(--arex)}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:14px;padding:14px 18px;background:var(--arex);color:#fff;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--arex) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--arex) 60%,#000)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn-row{display:grid;gap:8px}

.failhead{display:flex;align-items:center;gap:10px}
.failhead b{background:var(--miss);color:#fff;font-size:13px;letter-spacing:.14em;border-radius:8px;padding:4px 10px}
.failhead span{font-weight:800;font-size:17px}

.machine{background:#0b2846;border-radius:16px;padding:14px;display:grid;gap:10px;color:#fff;border:6px solid #c9d0d7}
.machine .scr-title{font-family:var(--f-ko);font-weight:700;font-size:18px;line-height:1.4}
.machine .scr-sub{font-size:12px;color:#9fc4ec;font-weight:800}
.machine .scr-ja{font-size:12px;color:#c9d6e6}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{font:inherit;border:0;border-radius:12px;padding:12px 10px;background:#1f5d9c;color:#fff;cursor:pointer;display:grid;gap:2px;text-align:left;min-height:64px}
.mbtn .ko{font-family:var(--f-ko);font-weight:700;font-size:16px}
.mbtn .kana{font-size:11px;color:#a9d1f7;font-weight:800}
.mbtn .ja{font-size:11px;color:#d8e6f5}
.mbtn.alt{background:#3b4652}
.mbtn.go{background:#1d8a55}

.stamp{justify-self:center;width:136px;height:136px;border-radius:50%;border:4px double var(--express);color:var(--express);display:grid;place-content:center;text-align:center;transform:rotate(-10deg);font-weight:800;line-height:1.2}
.stamp small{font-size:10px;letter-spacing:.12em}
.stamp strong{font-size:22px;letter-spacing:.06em}
.stamp span{font-size:11px}
.stars{justify-self:center;font-size:26px;letter-spacing:6px;color:var(--sign)}
.stars s{color:var(--line);text-decoration:none}
.learned{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.learned li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding:6px 0;flex-wrap:wrap}
.learned b{font-family:var(--f-ko);font-size:15px}
.learned span{font-size:12px;color:var(--muted)}
.notes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.notes li{background:color-mix(in srgb,var(--miss) 8%,var(--card));border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--muted)}
.notes li b{display:block;color:var(--ink);font-size:13px}
.note{font-size:11px;color:var(--muted);line-height:1.6}

.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 22px;text-align:center;display:grid;gap:4px;pointer-events:none;animation:pop .3s ease-out;z-index:6;max-width:80vw}
.toast b{font-family:var(--f-ko);font-size:26px}
.toast span{font-size:13px;font-weight:800;color:var(--muted)}
.skip-btn{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:3;font:inherit;font-size:12.5px;font-weight:800;border:0;border-radius:999px;padding:9px 14px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.fade{position:absolute;inset:0;background:#0b0f14;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:8}
.fade.on{opacity:1}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chapters li{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 9px 4px 4px}
.chapters li span{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-size:10px}
.chapters li.done{color:var(--ink)}
.chapters li.done span{background:var(--ok);color:#fff}
.chapters li.now{color:var(--arex);box-shadow:inset 0 0 0 1.5px var(--arex)}
.chapters li.now span{background:var(--arex);color:#fff}
.quizhead{display:flex;align-items:center;gap:12px}
.qbadge{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;font-family:var(--f-ko)}
.quizhead h2{font-size:17px}
.machine.kiosk{background:#fbfaf7;color:#2b1d14;border-color:#3e2723}
.machine.kiosk .scr-sub{color:#8d6e63}.machine.kiosk .scr-ja{color:#6d4c41}
.machine.kiosk .mbtn{background:#efe6dc;color:#2b1d14}.machine.kiosk .mbtn .kana{color:#8d6e63}.machine.kiosk .mbtn .ja{color:#5d4037}
.machine.kiosk .mbtn.go{background:#3e2723;color:#fff}.machine.kiosk .mbtn.go .kana,.machine.kiosk .mbtn.go .ja{color:#e6d5c8}
.machine.cooker{background:#2b0f0f;border-color:#c62828}
.machine.cooker .mbtn{background:#5d1a1a}.machine.cooker .mbtn.go{background:#c62828}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 1s linear infinite;justify-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
.fallback{position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;gap:8px}
/* ---- v5 additions ---- */
.hud-left{max-width:560px}
.chip.stampc{color:#b8860b}
.chip i.sim{background:linear-gradient(135deg,#3c78c9,#9fd3ff)}
.hud-actions .pill-btn.menubtn{background:var(--ink);color:var(--card)}
#minimap{cursor:pointer}
.pimg{width:100%;border-radius:10px}
.pin{font-size:28px;letter-spacing:10px;text-align:center;color:#9fc4ec}
.mgrid.one{grid-template-columns:1fr}
.machine.atm{background:#0d3b2a;border-color:#b7c3bd}
.machine.atm .mbtn{background:#1f8a55}.machine.atm .mbtn.alt{background:#3b4652}
.machine.app{background:#f6f8fa;color:#1b2230;border-color:#1b2230;border-radius:26px}
.machine.app .scr-sub{color:#2f8f4f}.machine.app .scr-ja{color:#5b6575}
.machine.app .mbtn{background:#e8eef3;color:#1b2230}.machine.app .mbtn .kana{color:#2f6f9f}.machine.app .mbtn .ja{color:#5b6575}
.machine.app .mbtn.go{background:#2f8f4f;color:#fff}.machine.app .mbtn.go .kana,.machine.app .mbtn.go .ja{color:#e3f6ea}
.receipt{background:#fff;color:#2b1d14;border-radius:6px;padding:10px 12px;display:grid;gap:3px;font-family:var(--f-ko);font-size:13px;border:1px dashed #b9a99a}
.receipt b{font-size:14px;letter-spacing:.1em}
.receipt .code{font-weight:900;font-size:16px;color:#c62828;border-top:1px dashed #b9a99a;padding-top:5px;margin-top:3px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0}
.fourcut{justify-self:center;width:min(240px,70vw);background:#fff;border-radius:6px;padding:10px 10px 6px;display:grid;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(-2deg)}
.fourcut.black{background:#111}.fourcut.pink{background:#f8c8dc}
.fourcut img,.fourcut .noimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px;display:block;background:#ccc}
.fourcut b{font-size:10px;letter-spacing:.12em;text-align:center;color:#1b2230;font-family:var(--f-ko)}
.fourcut.black b{color:#fff}
.auto-btn{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:3;font:inherit;font-size:14px;font-weight:800;border:0;border-radius:999px;padding:11px 16px;background:#ffc629;color:#1b2230;box-shadow:0 4px 0 #c99400,0 6px 14px rgba(0,0,0,.25);cursor:pointer}
.auto-btn.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.choice.ok{position:relative;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card));animation:okpop .45s ease-out}
.choice.ok::after{content:'ピンポン♪';position:absolute;right:10px;top:-11px;font-size:11px;font-weight:900;color:#fff;background:var(--ok);border-radius:999px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.choice.dim{opacity:.38}
.choice:disabled{cursor:default}
@keyframes okpop{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.choice.ok{animation:none}}
.hud-start{display:flex;align-items:center;gap:6px;min-width:0;pointer-events:auto}
.exitbtn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);border:0;box-shadow:var(--shadow);cursor:pointer;padding:0}
.exit-ask{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,14,30,.55);padding:16px}
.exit-ask[hidden]{display:none}
.exit-ask__box{width:min(360px,100%);background:var(--card);color:var(--ink);border-radius:18px;padding:18px;display:grid;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.exit-ask__box b{font-size:17px}.exit-ask__box p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.exit-ask__btns{display:flex;gap:8px}.exit-ask__btns .btn{flex:1}
.btn.tk-note{background:#2F8CFF;color:#fff;border-color:#1b2230}
img.selfie{width:100%;border-radius:12px;border:6px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(1.5deg)}

/* トレ韓 ねこ */
.neko-bubble{position:absolute;left:0;top:0;z-index:4;pointer-events:none;max-width:min(260px,64vw);background:var(--card);color:var(--ink);border-radius:16px;padding:8px 12px;font-size:12.5px;font-weight:800;line-height:1.5;box-shadow:var(--shadow);border:2px solid #4A3B36}
.neko-bubble b{display:block;font-size:10.5px;color:#EFA36A;letter-spacing:.06em}
.neko-bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid #4A3B36;border-bottom:2px solid #4A3B36;transform:translateX(-50%) rotate(45deg)}
.neko-line{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,#FFE2C2 45%,var(--card));border-radius:14px;padding:8px 12px 8px 6px}
.neko-line img{flex:none}
.neko-line p{margin:0;font-size:13px;font-weight:800;line-height:1.55;color:var(--ink)}
.neko-line b{display:block;font-size:10.5px;color:#c97a3a;letter-spacing:.06em}
.zk-new{font-style:normal;margin-left:auto;background:#ffc629;color:#1b2230;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900;letter-spacing:.04em;animation:pop .4s ease-out}
.peek summary{cursor:pointer;font-size:11.5px;font-weight:800;color:var(--muted);list-style:none;display:inline-block;margin-top:2px;border:1.5px dashed var(--line);border-radius:999px;padding:2px 10px}
.peek summary::-webkit-details-marker{display:none}
.peek[open] summary{color:var(--miss);border-color:var(--miss)}

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';

   ========================================================================= */
const $ = id => document.getElementById(id);
const canvas = $('view');
const DEBUG = location.hash === '#debug';

try{
  renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance', stencil:false});
}catch(e){
  $('app').innerHTML = '<div class="fallback"><h2>3D表示に対応していません</h2><p>最新のブラウザでもう一度開いてください。</p></div>';
  throw e;
}
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, 1, 0.08, 1600);
const hemi = new THREE.HemisphereLight('#ffffff', '#8d969f', .3); scene.add(hemi);
const key = new THREE.DirectionalLight('#fff4e6', 1.5);
key.castShadow = true;
Object.assign(key.shadow.camera, {left:-17, right:17, top:17, bottom:-17, near:1, far:120});
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.035; key.shadow.radius = 3;
scene.add(key, key.target);
const keyOffset = new THREE.Vector3(5, 15, 6);

let LR = null;                                   // current level root
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const P = (ko, kana, ja) => ({ko, kana, ja});
const won = n => '₩' + Math.round(n).toLocaleString('en-US');
const yen = n => '¥' + Math.round(n).toLocaleString('en-US');
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const DEG = Math.PI/180;
const markDyn = o => { o.userData.dynamic = true; return o; };

/* ---------- quality tiers ---------- */
const DPR = window.devicePixelRatio || 1;
const IS_MOBILE = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || Math.min(screen.width, screen.height) < 760;
const QPRESETS = {
  high:{key:'high', label:'高', pr:Math.min(DPR, 2), shadow:2048, ao:true, bloom:true, msaa:4, refl:true, water:true, grass:1, crowd:1, dust:true},
  mid:{key:'mid', label:'中', pr:Math.min(DPR, 1.5), shadow:2048, ao:false, bloom:true, msaa:2, refl:false, water:true, grass:.55, crowd:.75, dust:true},
  low:{key:'low', label:'低', pr:Math.min(DPR, 1), shadow:1024, ao:false, bloom:false, msaa:0, refl:false, water:false, grass:0, crowd:.5, dust:false}
};
let QMODE = 'auto';
try{ QMODE = localStorage.getItem('seoulRehearsal.q') || 'auto'; }catch(_){}
let QS = QPRESETS[QMODE === 'auto' ? (IS_MOBILE ? 'mid' : 'high') : QMODE] || QPRESETS.mid;
let composer, renderPass, gtaoPass, bloomPass, gradePass, outPass;
const GradeShader = {
  uniforms:{tDiffuse:{value:null}, uSat:{value:1.08}, uContrast:{value:1.05}, uVig:{value:.32}, uLift:{value:new THREE.Vector3()}, uGain:{value:new THREE.Vector3(1,1,1)}, uGrain:{value:.025}, uTime:{value:0}},
  vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uSat, uContrast, uVig, uGrain, uTime; uniform vec3 uLift, uGain; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv); vec3 col = c.rgb;
      float l = dot(col, vec3(.2126,.7152,.0722));
      col = mix(vec3(l), col, uSat);
      col = (col - .5) * uContrast + .5;
      col = col * uGain + uLift * (1.0 - col);
      vec2 d = vUv - .5; col *= 1.0 - dot(d, d) * uVig * 2.2;
      float n = fract(sin(dot(vUv * vec2(127.1 + uTime, 311.7 - uTime), vec2(12.9898, 78.233))) * 43758.5453);
      col += (n - .5) * uGrain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), c.a);
    }`
};
const SanitizeShader = {
  uniforms:{tDiffuse:{value:null}},
  vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); vec3 x = c.rgb; if(!(x.r < 1e4 && x.r >= 0.0) || !(x.g < 1e4 && x.g >= 0.0) || !(x.b < 1e4 && x.b >= 0.0)) x = vec3(0.0); gl_FragColor = vec4(min(x, vec3(48.0)), c.a); }'
};
function viewSize(){ return [Math.max(1, canvas.clientWidth), Math.max(1, canvas.clientHeight)]; }
function buildComposer(){
  if(composer){ composer.renderTarget1.dispose(); composer.renderTarget2.dispose(); for(const p of composer.passes) p.dispose && p.dispose(); }
  const [w, h] = viewSize();
  renderer.setPixelRatio(QS.pr);
  const rt = new THREE.WebGLRenderTarget(w * QS.pr, h * QS.pr, {type:THREE.HalfFloatType, samples:QS.msaa});
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(QS.pr); composer.setSize(w, h);
  renderPass = new RenderPass(scene, camera); composer.addPass(renderPass);
  composer.addPass(new ShaderPass(SanitizeShader));
  gtaoPass = null; bloomPass = null;
  if(QS.ao){
    gtaoPass = new GTAOPass(scene, camera, w, h);
    gtaoPass.updateGtaoMaterial({radius:.55, distanceExponent:1.6, thickness:1.4, scale:1.15, samples:16, distanceFallOff:1});
    gtaoPass.updatePdMaterial({lumaPhi:10, depthPhi:2, normalPhi:3, radius:5, rings:2, samples:12});
    gtaoPass.blendIntensity = .9;
    const cache = gtaoPass._visibilityCache;
    gtaoPass.overrideVisibility = function(){ this.scene.traverse(o => { cache.set(o, o.visible); if(o.isPoints || o.isLine || o.isSprite || o.userData.noAO || (o.material && o.material.transparent)) o.visible = false; }); };
    composer.addPass(gtaoPass);
  }
  if(QS.bloom){ bloomPass = new UnrealBloomPass(new THREE.Vector2(w, h), .5, .55, .95); composer.addPass(bloomPass); }
  outPass = new OutputPass(); composer.addPass(outPass);
  gradePass = new ShaderPass(GradeShader); composer.addPass(gradePass);
  applyGrade();
}
function setQuality(mode, persist=true){
  QMODE = mode;
  if(persist) try{ localStorage.setItem('seoulRehearsal.q', mode); }catch(_){}
  const name = mode === 'auto' ? (QS && QS.autoPicked ? QS.key : (IS_MOBILE ? 'mid' : 'high')) : mode;
  QS = {...QPRESETS[name]};
  key.shadow.mapSize.set(QS.shadow, QS.shadow);
  if(key.shadow.map){ key.shadow.map.dispose(); key.shadow.map = null; }
  buildComposer();
  REFL.on.value = QS.refl && REFL.active ? 1 : 0;
  if(typeof onQualityChanged === 'function') onQualityChanged();
}
/* automatic step-down when the frame rate is low */
const PERF = {t:0, frames:0, armed:false, wait:2.5};
function perfArm(){ PERF.t = 0; PERF.frames = 0; PERF.wait = 2.5; PERF.armed = QMODE === 'auto'; }
function perfTick(dt){
  if(!PERF.armed) return;
  if(PERF.wait > 0){ PERF.wait -= dt; return; }
  PERF.t += dt; PERF.frames++;
  if(PERF.t >= 3){
    const fps = PERF.frames / PERF.t; PERF.armed = false;
    if(fps < 30 && QS.key !== 'low'){
      const nxt = QS.key === 'high' ? 'mid' : 'low';
      QS = {...QPRESETS[nxt], autoPicked:true}; key.shadow.mapSize.set(QS.shadow, QS.shadow); if(key.shadow.map){ key.shadow.map.dispose(); key.shadow.map = null; }
      buildComposer(); REFL.on.value = QS.refl && REFL.active ? 1 : 0;
      if(typeof toast === 'function') toast('画質を自動調整', `動きを優先して「${QS.label}」にしました（メニューで変更可）`, 2200);
      if(typeof onQualityChanged === 'function') onQualityChanged();

    }
  }
}

/* ---------- sky & environments ---------- */
/* the sun disk in Sky.js can exceed half-float range (→ Inf/NaN on some mobile GPUs, which

Sky.SkyShader.fragmentShader = Sky.SkyShader.fragmentShader.replace('gl_FragColor = vec4( retColor, 1.0 );',
  'vec3 sc = retColor; if(!(sc.r < 1e4 && sc.r >= 0.0) || !(sc.g < 1e4 && sc.g >= 0.0) || !(sc.b < 1e4 && sc.b >= 0.0)) sc = vec3(0.0); gl_FragColor = vec4( min(sc, vec3(40.0)), 1.0 );');
const sky = new Sky(); sky.scale.setScalar(900); sky.visible = false; sky.userData.noAO = true; scene.add(sky);
const SUN = new THREE.Vector3(0, 1, 0);
const pmrem = new THREE.PMREMGenerator(renderer);
const ENV_CACHE = {};
const ENVS = {
  indoor:{type:'room', bth:2.0, envI:.8, bg:'#cfd8e0', hemi:['#ffffff','#7d8690',.28], key:['#fff3e2',1.55], sun:V(.35,.9,.25), exp:1.05, fog:null, bloom:.42, grade:{sat:1.1, contrast:1.06, vig:.3, lift:[.0,.0,.01], gain:[1,1,1]}},

/* ---------- ambience (synthesised, starts after the first tap) ---------- */

function setAmbience(kind){

  AMB.want = kind;
  const ctx = audioCtx(); if(!ctx || AMB.kind === kind) return;
  stopAmbience(); AMB.kind = kind;
  const prof = {hall:[[700,.05],[180,.05]], station:[[500,.05],[120,.06]], train:[[260,.12],[90,.12]], tunnel:[[300,.14],[70,.14]], street:[[900,.05],[220,.06]], rain:[[2600,.08],[600,.05]], river:[[420,.06],[1400,.025]], car:[[200,.1],[80,.1]], bus:[[230,.1],[85,.1]], cafe:[[1200,.03],[300,.03]]}[kind] || [[600,.04]];

    const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = v;
    src.connect(fl).connect(g).connect(master); src.start(); AMB.nodes.push(src);

/* ---------- static merging: fewer draw calls, more detail ---------- */
const occluders = [], ceilingMeshes = [];
function collectAndMerge(root, opts={}){
  root.updateMatrixWorld(true);
  const isDyn = o => { let a = o; while(a && a !== root){ if(a.userData.dynamic) return true; a = a.parent; } return false; };
  // camera occluders & ceilings
  if(opts.occ !== false) root.traverse(o => {
    if(!o.isMesh || o.userData.noOcc || isDyn(o)) return;
    if(o.userData.ceiling){ ceilingMeshes.push(o); }
    if(o.userData.occ){ occluders.push(o); return; }
    if(o.material && (o.material.transparent || Array.isArray(o.material))) return;
    const p = o.geometry.parameters || {}, s = o.getWorldScale(new THREE.Vector3());
    if(o.geometry.type === 'BoxGeometry' && Math.max(p.width*s.x, p.height*s.y, p.depth*s.z) >= 3.2) occluders.push(o);
    else if(o.geometry.type === 'CylinderGeometry' && p.height*s.y >= 4 && p.radiusTop > .3) occluders.push(o);
    else if(o.userData.ceiling) occluders.push(o);
  });
  const buckets = new Map();
  root.traverse(o => {
    if(!o.isMesh || o.isInstancedMesh || o.isSkinnedMesh || o.userData.keep || o.userData.ceiling || Array.isArray(o.material) || isDyn(o)) return;
    if(o.material.isShaderMaterial || o.material.transparent || o.material.onBeforeCompile?.toString().includes('tRefl')) return;
    const g = o.geometry; if(!g.attributes.normal || !g.attributes.uv) return;
    const wp = o.getWorldPosition(new THREE.Vector3());
    const ch = Math.floor(wp.x / 24) + ',' + Math.floor(wp.z / 24);
    const k = o.material.uuid + '|' + (o.castShadow ? 1 : 0) + '|' + (g.index ? 'i' : 'n') + '|' + (g.attributes.color ? 'c' : '') + '|' + ch;
    if(!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(o);
  });
  let merged = 0;
  for(const list of buckets.values()){
    if(list.length < 2) continue;
    const geos = list.map(o => { const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld); g.clearGroups(); for(const n of Object.keys(g.attributes)) if(!['position','normal','uv','color'].includes(n)) g.deleteAttribute(n); return g; });
    let mg; try{ mg = mergeGeometries(geos, false); }catch(_){ mg = null; }
    for(const g of geos) if(g !== mg) g.dispose();
    if(!mg) continue;
    const m = new THREE.Mesh(mg, list[0].material); m.castShadow = list[0].castShadow; m.receiveShadow = true; m.userData.merged = true;
    root.add(m);
    if(opts.local){ m.geometry.applyMatrix4(new THREE.Matrix4().copy(root.matrixWorld).invert()); }
    for(const o of list){ o.parent && o.parent.remove(o); if(!occluders.includes(o)) o.geometry.dispose(); merged++; }
  }
  return merged;
}

    _np.set(h.position.x + _st.x * spd * dt, h.position.y, h.position.z + _st.z * spd * dt);
    if(typeof LEVEL !== 'undefined' && LEVEL && LEVEL.rects){
      let rr = LEVEL.rects, cc = LEVEL.circles || [];
      if(!Array.isArray(rr)){ const k = h.position.y < -2 ? 'D' : 'U'; rr = rr[k] || []; cc = (LEVEL.circles && LEVEL.circles[k]) || []; }
      resolve(_np, rr, cc);
    }
    const b = u.b; _np.x = clamp(_np.x, Math.min(...b.x), Math.max(...b.x)); _np.z = clamp(_np.z, Math.min(...b.z), Math.max(...b.z));
    const moved = Math.hypot(_np.x - h.position.x, _np.z - h.position.z);
    h.position.x = _np.x; h.position.z = _np.z;
    if(moved < spd * dt * .25){ u.stuck = (u.stuck || 0) + dt; if(u.stuck > 1.2) pickTarget(h); } else u.stuck = 0;
    const want = Math.atan2(_st.x, _st.z); let dr = want - h.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); h.rotation.y += dr * Math.min(1, dt*5);
    animHuman(h, dt, moved / dt, t);
  }
}

function storeShelves(st, x, y0, len, rows){

  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sv = new THREE.Vector3(), pv = new THREE.Vector3(), col = new THREE.Color(); let pi = 0;
  const put = (px,py,pz,w,h,d,c) => { if(pi >= 600) return; pv.set(px,py,pz); sv.set(w,h,d); m4.compose(pv, q, sv); prods.setMatrixAt(pi, m4); prods.setColorAt(pi, col.set(c)); pi++; };

function toutAI(A, h, dt, t){

    if(d > 1.3){ const a = Math.atan2(p.x - h.position.x, p.z - h.position.z); h.rotation.y = a; h.position.x += Math.sin(a)*1.6*dt; h.position.z += Math.cos(a)*1.6*dt; animHuman(h, dt, 1.6, t); }

    return;
  }
  animHuman(h, dt, 0, t);
}

  tapGate(i){
    const express = i >= 4;

    if(S.single) return open('삑!', 'ピッ！ 1回用カードで入場');
    if(S.card){ if(S.bal >= 1500) return open('삑!', `ピッ！ 残高 ${won(S.bal)}`); return fail('lowBalance'); }
    fail(S.express ? 'noExpressTicket' : 'noTicket');
  },
  update(dt, t){
    const p = player.position;
    const nearDoor = S.lvl === 'U' && Math.hypot(p.x, p.z - 12) < 3.4, nearSide = S.lvl === 'U' && Math.hypot(p.x - 12, p.z - 8.4) < 3.2;
    for(const d of this.doors){ const near = d.userData.axis === 'x' ? nearDoor : nearSide; const want = near ? d.userData.open : d.userData.home; d.position[d.userData.axis] += (want - d.position[d.userData.axis]) * (1 - Math.exp(-dt*5)); }
    GATES.forEach((c, i) => { if(this.laneOpen[i] > 0 && !(S.lvl === 'D' && Math.abs(p.x - c) < .5 && p.z < -45 && p.z > -47.2)) this.laneOpen[i] -= dt; });
    for(const f of this.flaps){ const open = this.laneOpen[f.userData.lane] > 0; f.scale.x += ((open ? .06 : 1) - f.scale.x) * (1 - Math.exp(-dt*8)); f.material.color.set(open ? '#3ccf7d' : '#ff6b5e'); }
    this.escTex[0].offset.y = (this.escTex[0].offset.y + dt*.55) % 1;
    this.escTex[1].offset.y = (this.escTex[1].offset.y - dt*.55 + 1) % 1;
    for(const c of this.cars){ c.position.z += c.userData.v * dt; if(c.position.z > 34) c.position.z = -38; }
    const below = S.lvl === 'D' || (S.lvl === 'E' && p.y < -2.5);
    key.intensity += ((below ? .05 : ENVS.airport.key[1]) - key.intensity) * Math.min(1, dt*3);
    REFL.y = below ? -5 : 0;
    if(this.trainIn) this.train.position.x += (3 - this.train.position.x) * (1 - Math.exp(-dt*.9));
    if(S.lvl === 'D' && S.ap.via && !this.cleared && p.z < -50){
      this.cleared = true; this.trainIn = true;
      S.ride = S.ap.via === 'express' ? 'arexExpress' : 'arexGeneral'; S.path = 'train';
      toast('열차가 들어옵니다', '電車が入ってきます', 2400); chime();
      setTimeout(() => chapterClear('arex'), 2600);
    }
  },
  map(){
    const lv = S.lvl === 'E' ? (player.position.y > -2.5 ? 'U' : 'D') : S.lvl;
    if(lv === 'U') return {label:'1F', x0:-12, x1:27, z0:-24, z1:22, stripes:[[17.4,27,-24,22,'#9aa3ab']], blocks:[[-1.2,3.6,-14,-12.6],[-12,-2.1,11.9,12.1],[2.1,12,11.9,12.1],[12,12.2,-14,7.2],[12,12.2,9.6,12]],

  objective(){
    const s = S.su;
    if(!s.coffee){

      return s.ready ? '受け取りカウンターでコーヒーを受け取る' : '呼び出しベルが鳴るまで待つ（寄り道もOK）';

  ]; },
  update(dt, t){
    const s = S.su, p = player.position;
    if(s.ordered && !s.ready && performance.now() - s.ordered > 9000){ s.ready = true; drawPickup(this.pickT, true); tone([880, 880, 880], 'square', .08, .05); toast('징~ 진동벨', 'ブーッ！ 呼び出しベルが鳴った', 1800); }
    if(s.popup && !s.popupReady && performance.now() - s.popup > 20000){ s.popupReady = true; tone([1046, 1318], 'sine', .14, .06); toast('[문자] 입장 순서입니다', 'SMS：「입장 순서가 되었습니다（入場の順番です）」', 2600); learn(P('입장','イプチャン','入場')); }
    for(const tr of this.trains){ tr.position.x += (tr.rotation.y ? -1 : 1) * tr.userData.v * dt; if(tr.position.x > 120) tr.position.x = -120; if(tr.position.x < -120) tr.position.x = 120; }
    // alley car
    const c = this.car, u = c.userData;
    if(u.wait > 0){ u.wait -= dt; if(u.wait <= 0){ c.position.set(1.0, 0, -66); u.v = 4; } }
    else {
      const ahead = p.z > c.position.z + 2 && p.z < c.position.z + 7.5 && Math.abs(p.x - c.position.x) < 1.6 && !inRoom(SU_ROOMS.cafe, p.x, p.z);
      const npcAhead = npcs.some(h => h.parent && h.visible && !h.userData.idle && h.position.z > c.position.z + 2 && h.position.z < c.position.z + 4.5 && Math.abs(h.position.x - c.position.x) < 1.3);
      if(ahead){ u.v = Math.max(0, u.v - dt*8); this.stopT += dt; if(this.hornCD <= 0){ this.hornCD = 3; tone([392, 392], 'square', .25, .06); toast('빵빵!', '後ろから車！ 端へ寄ろう', 1300); } if(this.stopT > 4.5 && !S.ui && !S.fails.includes('alleyCar')){ fail('alleyCar'); this.stopT = 0; } }
      else if(npcAhead){ u.v = Math.max(0, u.v - dt*6); }
      else { this.stopT = 0; u.v = Math.min(4.5, u.v + dt*2); }
      c.position.z += u.v * dt;
      for(const w of u.wheels) w.rotation.y += u.v * dt / .33;
      if(c.position.z > 10){ c.position.z = -70; u.v = 0; u.wait = rand(10, 18); }
    }
    this.hornCD -= dt;
  },
  map(){ return {label:'聖水', x0:-12, x1:12, z0:-60, z1:12, stripes:[[-40,40,8,17,'#9aa3ab']], blocks:[[-12,-4.4,-62,-48],[-12,-4.4,-38,-24],[-12,-4.4,-14,2],[4.4,12,-62,-38.5],[4.4,12,-28.5,-24],[4.4,12,-14,6],[-12,-11.6,-24,-14],[-12,-11.6,-48,-38],[11.6,12,-38.5,-14]],

/* =========================================================================
   相棒ねこ 3D — rigged toy-style models of トレ韓's four cats.
   · skinned mochi body on a skeleton: hips → belly → head (bends, twists, nods)
   · ears and tail are bone chains driven by springs / follow-through
   · a real 3D face: glossy eyes with catch-lights that blink and look at you,
     happy / star / closed eyes, brows, a morphing mouth that talks, blush, tears
   · character lighting: rim + sky fill in the shader, baked AO, contact shadow

const NK3 = {k:.0024, zs:.86, ink:3.1};
const NK_LOOK = {

  soda:{body:'#CFE5FF', inner:'#FFC9D3', tail:1},

const V2 = (x, y) => new THREE.Vector2(x, y);

const nkSmooth = t => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };

/* side profile (radius, height) of the mochi body, traced from the SVG silhouette */
const NK_PROF = (() => {

/* skeleton rest positions (model space) */
const NK_BA = V3(0, 14, 0), NK_HA = V3(0, 40, 0);
const toHead = v => v.clone().sub(NK_HA), toBelly = v => v.clone().sub(NK_BA);
/* body skin weights: hips(0) → belly(1) → head(2) by height */

/* ---------- materials & character lighting ---------- */
/* rim light + sky/ground fill added on top of the scene lighting, so the cat reads clearly in any scene */
function nkShade(m, fill=.22, rim=.42){

    s.uniforms.nkFill = {value:fill}; s.uniforms.nkRim = {value:new THREE.Color('#fff1e0').multiplyScalar(rim)};

      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
  {
    vec3 nkV = normalize(vViewPosition);
    float nkNV = clamp(dot(normal, nkV), 0.0, 1.0);
    vec3 nkUp = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);
    float nkSky = dot(normal, nkUp) * 0.5 + 0.5;
    totalEmissiveRadiance += diffuseColor.rgb * nkFill * mix(0.35, 1.0, nkSky);
    totalEmissiveRadiance += nkRim * pow(1.0 - nkNV, 2.6) * mix(0.25, 1.0, nkSky);

const NK_MATS = new Map();
function nkPlush(color, vc=false){

}
function nkSolid(color, rough=.45, o={}){ const k = 'S' + color + rough + JSON.stringify(o); if(!NK_MATS.has(k)) NK_MATS.set(k, nkShade(new THREE.MeshStandardMaterial({color, roughness:rough, metalness:0, ...o}), .18, .3)); return NK_MATS.get(k); }

const NK_SHARED = () => new Set([...NK_MATS.values(), NK_INKM, NK_INKF, NK_EYE.mat, NK_EYE.hl, NK_EYE.star, NK_EYE.tear, NK_EYE.mouth, NK_EYE.shadow]);
const NK_EYE = {};

}
/* a rigid mesh with an ink outline that shares its transform */
function nkPart(geo, mat, parent, o={}){

const nkBlob = (rx, ry, rz, ws=22, hs=16) => new THREE.SphereGeometry(1, ws, hs).scale(rx, ry, rz);
function nkStar(R, r, n=5){ const s = new THREE.Shape(); for(let i = 0; i < n*2; i++){ const a = Math.PI/2 + i * Math.PI / n, q = i % 2 ? r : R; i ? s.lineTo(Math.cos(a)*q, Math.sin(a)*q) : s.moveTo(Math.cos(a)*q, Math.sin(a)*q); } s.closePath(); return s; }

/* the curvy 4-point star of the 「やった」 eyes */
function nkTwinkle(R){ const s = new THREE.Shape(), q = R * .2; s.moveTo(0, R); s.quadraticCurveTo(q, q, R, 0); s.quadraticCurveTo(q, -q, 0, -R); s.quadraticCurveTo(-q, -q, -R, 0); s.quadraticCurveTo(-q, q, 0, R); return s; }

/* ---------- static body markings (ㅌ, whisker marks, muzzle, patch): projected decal ---------- */
function nkMarkSVG(who){
  let s = '';

  if(who === 'mint') s += '<ellipse cx="186" cy="84" rx="52" ry="46" fill="#E4E4EE"/>';
  if(who === 'tore') s += NK_TIEUT + '<path d="M40 117 L53 121 M39 131 L52 132 M200 117 L187 121 M201 131 L188 132" stroke="#EFA36A" stroke-width="4.5" stroke-linecap="round"/>';

function nkSVGTex(svg){

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;

function nkDecalGeo(phi0, len, lift=.35){

/* ---------- mouth shapes (SVG coords, upper lip U / lower lip D, 9 points each) ---------- */
const NK_MOUTH = (() => {
  const line = (a, b) => Array.from({length:9}, (_, i) => [a[0] + (b[0] - a[0]) * i / 8, a[1] + (b[1] - a[1]) * i / 8]);

    wavy:{U:WV, D:WV},
    o:{U:OU, D:OD},
    open:{U:nkQuad([111,137.5], [120,134.5], [129,137.5], 9), D:nkQuad([111,137.5], [120,152], [129,137.5], 9)},

/* expression targets (continuous parameters, blended every frame) */
const NK_EXPR = {
  normal:{open:1, happy:0, star:0, big:0, brow:0, blush:.72, tear:0, m:{w:1}},
  happy:{open:1, happy:1, star:0, big:0, brow:0, blush:1, tear:0, m:{smile:1}},
  get:{open:1, happy:0, star:1, big:0, brow:0, blush:1, tear:0, m:{smile:1}},
  oshii:{open:1, happy:0, star:0, big:1, brow:1, blush:.85, tear:1, m:{wavy:1}},

const NK_FACE_LIST = Object.keys(NK_EXPR);

/* ---------- build one cat ---------- */
function makeNeko3D(who){
  nkEyeMats();
  const L = NK_LOOK[who] || NK_LOOK.tore;
  const root = new THREE.Group(); root.name = 'neko3d:' + who; root.scale.setScalar(NK3.k);
  const A = {who, bones:[], skinned:[], ears:[], tailB:[], feet:[], arms:[], sparkles:[], zz:[], texs:[], eyes:[],
    face:'normal', ph:0, walk:0, sl:0, react:'', rt:0, rdur:1, twT:2, tw:0, twE:0, blT:3, bl:0, sacT:1, sac:V2(0,0), gaze:V2(0,0),
    twist:0, nod:0, tilt:0, tiltT:4, tiltG:0, turning:false, yawV:0, lastYaw:0, hopV:0, lastHop:0, talk:0, sleepK:0,
    E:{open:1, happy:0, star:0, big:0, brow:0, blush:.72, tear:0, m:{w:1, smile:0, wavy:0, o:0, open:0}}, mKey:''};
  /* --- skeleton --- */
  const bone = (name, parent, pos) => { const b = new THREE.Bone(); b.name = name; b.position.copy(pos); parent.add(b); A.bones.push(b); return b; };
  const hips = bone('hips', root, V3(0, 0, 0));

  const head = bone('head', belly, NK_HA.clone().sub(NK_BA));
  A.hips = hips; A.belly = belly; A.head = head;

    const base = V3(s*45, 124, -2), rest = new THREE.Euler(-.06, s*.16, -s*.3);
    const e0 = bone('ear0' + s, head, toHead(base)); e0.rotation.copy(rest);
    const e1 = bone('ear1' + s, e0, V3(0, 15, 0));
    A.ears.push({s, e0, e1, rest, a:0, v:0, z:0, zv:0}); earRest.push({base, rest});

  }

    const m = new THREE.SkinnedMesh(geo, mat); m.frustumCulled = false; m.castShadow = cast; root.add(m); A.skinned.push(m);
    if(ink){ const h = new THREE.SkinnedMesh(geo, nkInk()); h.frustumCulled = false; root.add(h); A.skinned.push(h); }
    return m;
  };

  const gBody = new THREE.LatheGeometry(NK_PROF, 64); gBody.scale(1, 1, NK3.zs);
  {
    const p = gBody.attributes.position, cols = [], bc = new THREE.Color(L.body), hsl = {}; bc.getHSL(hsl); bc.setHSL(hsl.h, Math.min(1, hsl.s*1.3), hsl.l);
    const occ = [...earRest.map(e => [e.base, 22, .78])];
    if(who === 'remo') occ.push([V3(-76, 74, 14), 20, .8], [V3(76, 74, 14), 20, .8]);
    if(who !== 'remo') occ.push([V3(-19, 26, 80), 18, .8], [V3(19, 26, 80), 18, .8], [V3(0, 28, 84), 22, .86]);
    if(who === 'soda') occ.push([V3(-90, 84, -8), 20, .82], [V3(90, 84, -8), 20, .82]);
    const v = V3(0, 0, 0);
    for(let i = 0; i < p.count; i++){
      v.fromBufferAttribute(p, i);
      let ao = .56 + .44 * nkSmooth(v.y / 18);
      for(const [c, r, k] of occ){ const d = v.distanceTo(c); if(d < r) ao *= k + (1 - k) * nkSmooth(d / r); }

  if(mark){ const t = nkSVGTex(mark); A.texs.push(t); const m = skinMesh(nkDecalGeo(-Math.PI/2, Math.PI), nkDecalMat(t), false, false); m.renderOrder = 6; }
  if(L.patch){ const t = nkSVGTex(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512"><ellipse cx="186" cy="84" rx="52" ry="46" fill="${L.patch}"/></svg>`); A.texs.push(t); const m = skinMesh(nkDecalGeo(Math.PI/2, Math.PI), nkDecalMat(t), false, false); m.renderOrder = 6; }
  /* --- ears: skinned two-bone cones with a pink inner --- */
  const earProf = [[0,0],[1,0],[.97,.2],[.83,.46],[.56,.75],[.24,.95],[.06,1],[0,1]].map(p => V2(p[0], p[1]));
  const innerProf = [[0,0],[1,0],[.9,.35],[.55,.72],[.15,.97],[0,1]].map(p => V2(p[0], p[1]));
  A.ears.forEach((E, i) => {
    const M = new THREE.Matrix4().compose(earRest[i].base, new THREE.Quaternion().setFromEuler(E.rest), V3(1, 1, 1));
    const ew = y => { const t = nkSmooth((y - 7) / 17); return [3 + i*2, 1 - t, 4 + i*2, t]; };
    const g = new THREE.LatheGeometry(earProf, 24).scale(19, 35, 9.5); nkSkin(g, (x, y) => ew(y)); g.applyMatrix4(M);

    nkSkin(g, (x, y, z, i) => { const u = Math.floor(i / (RS + 1)) / TS * (NT - 1), b = Math.min(NT - 2, Math.floor(u)), t = u - b; return [7 + b, 1 - t, 8 + b, t]; });

/* ---------- face rendering from the continuous expression state ---------- */
function nkMouthPts(E){
  const w = E.m; let sum = 0; for(const k in w) sum += w[k];
  const U = [], D = [];
  for(let i = 0; i < 9; i++){
    let ux = 0, uy = 0, dx = 0, dy = 0;
    for(const k in w){ const q = w[k] / sum, S = NK_MOUTH[k]; ux += S.U[i][0]*q; uy += S.U[i][1]*q; dx += S.D[i][0]*q; dy += S.D[i][1]*q; }
    U.push([ux, uy]); D.push([dx, dy]);
  }
  return {U, D};
}
function nkApplyFace(A, t, force){
  const E = A.E;
  // mouth: rebuild only when the shape really changed
  const {U, D} = nkMouthPts(E);
  const key = U.concat(D).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(';');
  if(force || key !== A.mKey){
    A.mKey = key; const M = A.mouth;
    const S = ([x, y], off) => toHead(nkSurf(x - 120, 204 - y, off).p);
    const area = Math.max(...U.map((u, i) => D[i][1] - u[1]));
    M.U.geometry.dispose(); M.U.geometry = nkTube(U.map(p => S(p, 1)), 1.75, 20, 6);
    M.D.geometry.dispose(); M.D.visible = area > .6; M.D.geometry = M.D.visible ? nkTube(D.map(p => S(p, 1)), 1.75, 20, 6) : new THREE.BufferGeometry();
    M.c0.position.copy(S(U[0], 1)); M.c1.position.copy(S(U[8], 1));
    M.fill.visible = area > .6;
    if(M.fill.visible){
      const pos = [], col = [], idx = [], cu = new THREE.Color('#B4566C'), cd = new THREE.Color('#F7A3B5');
      for(let i = 0; i < 9; i++){ const a = S(U[i], .7), b = S(D[i], .7); pos.push(a.x, a.y, a.z, b.x, b.y, b.z); col.push(cu.r, cu.g, cu.b, cd.r, cd.g, cd.b); if(i < 8){ const j = i*2; idx.push(j, j+1, j+2, j+1, j+3, j+2); } }

      M.fill.geometry.dispose(); M.fill.geometry = g;
    }

  const vis = (1 - E.happy) * (1 - E.star), big = 1 + .2 * E.big;

    const op = Math.max(.07, E.open);

    e.ball.scale.set(vis * big, op * vis * big, 1);
    e.ball.position.set(A.gaze.x * 2.6 * vis, A.gaze.y * 2 * vis + (1 - op) * -2.2, 0);
    e.hl[0].scale.setScalar(1 + .55 * E.big); e.hl[1].scale.setScalar(1 + .9 * E.big);
    const c = nkSmooth((.42 - E.open) / .3) * vis; e.cl.visible = c > .02; e.cl.scale.set(1, Math.max(.01, c), 1);
    e.hp.visible = E.happy > .02; e.hp.scale.set(E.happy, E.happy, 1);
    e.st.visible = E.star > .02; e.st.scale.setScalar(E.star * (1 + .08 * Math.sin(t * 7))); e.st.rotation.z = Math.sin(t * 2.6) * .18;
    e.br.visible = E.brow > .02; e.br.scale.set(E.brow, E.brow, 1); e.br.rotation.z = e.s * (.12 + Math.sin(t * 2) * .03) * E.brow;

}

/* ---------- per-frame animation. o = {moving, speed, yaw, sleepy, talking, look:Vector3(world)} ---------- */
const _nkW = V3(0, 0, 0);

  A.nod = nkDamp(A.nod, -Math.max(-.35, Math.min(.45, elev)) * .5 * attend, 4, dt);
  A.tilt = nkDamp(A.tilt, (o.talking ? Math.sin(t * 1.7) * .08 : A.tiltG) * (1 - A.sleepK), 3, dt);

    else if(rp < .72){ const a = (rp - .16) / .56; jump = Math.sin(Math.PI * a) * 64; spin = nkSmooth(a) * Math.PI * 2; sq += (1 - a) * .16 - .02; }

  const ix = 1 / Math.sqrt(Math.max(.55, sq));
  A.hips.position.y = hop; A.hips.scale.set(ix, sq, ix); A.hips.rotation.y = spin;
  A.hips.rotation.z = Math.sin(A.ph) * .1 * w;                                        // waddle: lean onto the planted foot
  A.hips.rotation.x = .08 * w + (R === 'oshii' ? -Math.sin(Math.PI * rp) * .18 : 0);  // lean into the walk / flinch back
  A.belly.rotation.set(A.nod * .35 + A.sl * .05 + A.sleepK * .05, A.twist * .35, -Math.sin(A.ph) * .05 * w + A.tilt * .3);
  A.head.rotation.set(A.nod * .65 + A.sl * .12 + A.sleepK * (.12 + Math.sin(t * 1.2) * .03), A.twist * .65, A.tilt * .7 - Math.sin(A.ph) * .04 * w);

  /* --- ears: two-bone springs that react to bounces and turns --- */
  A.twT -= dt; if(A.twT < 0){ A.twT = 1.6 + Math.random() * 4; A.twE = Math.random() < .5 ? 0 : 1; A.tw = 1; }
  A.tw = Math.max(0, A.tw - dt * 4);
  const perk = (R === 'get' || R === 'happy') ? 1 : 0;
  for(let i = 0; i < 2; i++){
    const e = A.ears[i], s = e.s;
    const tgt = A.sl * .5 + A.sleepK * .25 - perk * .1;
    const f = 160 * (tgt - e.a) - 9 * e.v - Math.max(-3000, Math.min(3000, acc)) * .0035;   // forward/back bend of the tip
    e.v += f * dt; e.a += e.v * dt; e.a = Math.max(-.7, Math.min(.9, e.a));
    const fz = 140 * (-e.z) - 8 * e.zv + A.yawV * 1.4 * s;       // sideways lag when turning
    e.zv += fz * dt; e.z += e.zv * dt; e.z = Math.max(-.5, Math.min(.5, e.z));
    const tw = A.twE === i ? Math.sin(A.tw * Math.PI * 4) * .25 * A.tw : 0;
    e.e0.rotation.set(e.rest.x - A.sl * .25 + e.a * .3, e.rest.y + s * tw, e.rest.z - s * (A.sl * .5 - perk * .12) + s * tw * .5);
    e.e1.rotation.set(e.a, 0, e.z * .6 - s * A.sl * .35);
  }

  /* --- tail: travelling wave down the chain + follow-through --- */
  const fast = R === 'happy' || R === 'get';
  const amp = fast ? .26 : .12 * (1 - A.sleepK * .7), freq = fast ? 9 : 2.1 * (1 - A.sleepK * .5);
  const tsg = Math.sign(A.tailB[1].position.x) || 1;
  A.tailB.forEach((b, i) => {
    const k = i / (A.tailB.length - 1);
    b.rotation.y = Math.sin(t * freq - i * .65) * amp + Math.sin(A.ph - i * .5) * .1 * w - A.yawV * .03 * (i + 1) / 6;
    b.rotation.z = Math.sin(t * freq * .7 - i * .5 + 1) * amp * .6 * (.4 + k) - tsg * A.sl * .16 * (i > 0 ? 1 : 0) + (R === 'get' ? tsg * .06 : 0);
    b.rotation.x = A.sl * .1;
  });

  /* --- feet: alternate steps, tucked while airborne --- */
  A.feet.forEach((f, i) => {
    const p = A.ph + (i ? Math.PI : 0), u = f.userData;
    f.position.z = u.z + Math.sin(p) * 9 * w;
    f.position.y = u.y + Math.max(0, -Math.cos(p)) * 7 * w + jump * .92;
    f.rotation.x = -Math.max(0, -Math.cos(p)) * .35 * w;
  });
  A.shadow.scale.setScalar(1 / (1 + hop / 70));

  /* --- hands & items --- */
  const lift = R === 'get' ? nkSmooth(Math.min(rp, 1 - rp) * 5) : 0;
  const bounce = R === 'happy' ? Math.abs(Math.sin(rp * Math.PI * 2)) * 6 : 0;
  if(A.hands){
    A.hands.position.set(0, lift * (A.item ? 118 : 0) + bounce + Math.sin(t * 2.3) * .8 + (o.talking ? Math.abs(Math.sin(t * 7)) * 1.6 : 0) - A.sl * 4, lift * (A.item ? 10 : 0));
    A.hands.rotation.set(-lift * (A.item ? .25 : 0) + A.sl * .15, 0, o.talking ? Math.sin(t * 3.5) * .06 : 0);
    if(!A.item && A.cups){
      // soda: paws float up to the headphones when happy, one paw waves while talking
      A.paws.forEach((p, i) => {
        const s = i ? 1 : -1, cup = toBelly(A.cups[i]);
        const r2 = fast ? nkSmooth(Math.min(rp, 1 - rp) * 5) : 0;
        p.position.lerpVectors(p.userData.home, cup, r2);
        if(s > 0 && o.talking && !r2){ p.position.y += Math.max(0, Math.sin(t * 6)) * 8; p.position.x += Math.sin(t * 6) * 3; }
        p.rotation.z = p.userData.rz * (1 - r2) + s * r2 * 1.2;
      });
    }
  }
  A.arms.forEach(a => {
    const s = a.s, cheer = fast ? Math.sin(t * 15 + (s > 0 ? 0 : 1.6)) * .32 : Math.sin(t * 3 + (s > 0 ? 0 : 1.4)) * .12;
    const wave = o.talking && s > 0 ? Math.sin(t * 8) * .35 : 0;
    a.sh.rotation.z = s * (cheer - A.sl * 1.7 - A.sleepK * 1.2) + wave;
    a.fore.rotation.z = -s * (.2 + (fast ? Math.sin(t * 15) * .3 : 0)) + wave * .8;
  });
  if(A.sprout){ A.sprout[0].rotation.z = Math.sin(t * 2.6) * .1 - A.twist * .2 + Math.sin(A.ph) * .1 * w; A.sprout[1].rotation.z = Math.sin(t * 2.6 - .8) * .18 - A.yawV * .03 + Math.sin(A.ph - .6) * .15 * w; A.sprout[0].rotation.x = A.sl * .5; }
  if(A.star) A.star.rotation.y = t * (fast ? 8 : 1.6);
  if(A.curl) A.curl.rotation.z = Math.sin(t * 3 - .5) * .1 + Math.sin(A.ph) * .14 * w;
  A.sparkles.forEach(k => { const v = .5 + .5 * Math.abs(Math.sin(t * 2.4 + k.userData.p)); k.scale.setScalar(v * (fast ? 1.3 : 1)); k.rotation.z = t * .8 + k.userData.p; k.position.y = k.userData.y + Math.sin(t * 1.5 + k.userData.p) * 3; });

  /* --- expression: blend toward the target, then blink / talk / sleep on top --- */
  const T = NK_EXPR[A.sleepK > .5 && A.face === 'normal' ? 'sleep' : A.face];
  A.blT -= dt; if(A.blT < 0){ A.blT = 2.2 + Math.random() * 3.8; A.bl = .16; if(Math.random() < .2) A.blT = .25; }
  A.bl = Math.max(0, A.bl - dt);
  const blink = A.bl > 0 ? Math.sin(Math.PI * (1 - A.bl / .16)) : 0;
  const rate = 14;
  E.open = nkDamp(E.open, T.open * (1 - blink) * (1 - A.sleepK * .9), A.bl > 0 ? 40 : 10, dt);
  for(const k of ['happy', 'star', 'big', 'brow', 'blush', 'tear']) E[k] = nkDamp(E[k], T[k], rate, dt);
  if(R === 'get') E.blush = Math.max(E.blush, .9 + .1 * Math.sin(t * 10));
  const flap = A.talk * (.35 + .65 * Math.max(0, Math.sin(t * 15.5)) * (.6 + .4 * Math.sin(t * 4.3)));
  for(const k in E.m){ const tg = (T.m[k] || 0) * (1 - flap * .85) + (k === 'open' ? flap : 0); E.m[k] = nkDamp(E.m[k], tg, k === 'open' ? 22 : rate, dt); }
  A.tearY = E.tear > .03 ? (A.tearY + dt * 3.2) % 12 : 0;
  nkApplyFace(A, t);

  /* --- Zzz while dozing --- */
  A.zz.forEach((z, i) => {
    z.visible = A.sleepK > .4;
    if(!z.visible) return;
    z.userData.t = (z.userData.t + dt * .32) % 1; const u = z.userData.t;
    z.position.set(30 + u * 22 + Math.sin(u * 7 + i) * 6, 150 + u * 70, 20);
    z.scale.setScalar(12 + u * 14); z.material.opacity = Math.sin(Math.PI * u) * (A.sleepK - .4) / .6;
  });
}

/* =========================================================================
   トレ韓 つながり · 相棒ねこ (follows you, reacts, gives hints),
   失敗図鑑 (persistent fail collection), 韓国語だけモード, トレ韓への記録

const NEKO_NAMES = {tore:'トレにゃん', soda:'ソーダ', mint:'ミント先生', remo:'レモ'};
const IN_TOREKAN = /\/trip\/seoul-3d/.test(location.pathname);
function buddyWho(){

  try{ const p = JSON.parse(localStorage.getItem('torekan.progress.v2') || 'null'); if(p && NEKO_NAMES[p.buddy]) return p.buddy; }catch(_){}
  return 'tore';
}
function nekoSVG(who, face){

  const cat = NK_CATS[who].replace('__CLIP__', clip);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="256" height="256"><defs>${who === 'mint' ? `<clipPath id="${clip}"><path d="${NK_BODY}"/></clipPath>` : ''}</defs><ellipse cx="120" cy="214" rx="80" ry="7" fill="${NK_INK}" opacity="0.12"/><g>${cat}${who === 'tore' ? NK_TIEUT : ''}${NK_FACES[face] || NK_FACES.normal}${who === 'mint' ? NK_GLASSES : ''}</g></svg>`;
}
const nekoURL = (who, face) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(nekoSVG(who, face));

/* ---------- the buddy in 3D ---------- */
const BUDDY = {who:buddyWho(), model:null, face:'normal', pos:V(0,0,0), last:V(0,0,0), yaw:0, bubbleT:0, idleT:0, stillT:0, lastObj:'', el:null, moving:false};
function buddyBuild(){
  if(BUDDY.model){ scene.remove(BUDDY.model); nekoDispose(BUDDY.model); }
  const m = makeNeko3D(BUDDY.who); markDyn(m); m.position.copy(BUDDY.pos); m.rotation.y = BUDDY.yaw; m.userData.nk.lastYaw = BUDDY.yaw;
  scene.add(m); BUDDY.model = m; nekoSetFace(m, BUDDY.face);
}
function buddyInit(){ buddyBuild(); BUDDY.el = $('nekoBubble'); }
function buddyFace(face, ms=2600){
  if(!BUDDY.model) return; BUDDY.face = face; BUDDY.stillT = 0;
  nekoSetFace(BUDDY.model, face); nekoReact(BUDDY.model, face);
  clearTimeout(buddyFace.t); if(face !== 'normal') buddyFace.t = setTimeout(() => buddyFace('normal'), ms);
}
function buddySay(text, face='happy', ms=3200){
  if(!BUDDY.el) return;
  BUDDY.el.innerHTML = `<b>${esc(NEKO_NAMES[BUDDY.who])}</b>${esc(text)}`; BUDDY.el.hidden = false; BUDDY.bubbleT = ms/1000; buddyFace(face, ms);
}
function buddyPlace(){
  if(!BUDDY.model) return; const p = player.position;
  BUDDY.pos.set(p.x - facing.x*.05 - facing.z*.68, p.y, p.z - facing.z*.05 + facing.x*.68);
  BUDDY.last.copy(BUDDY.pos); BUDDY.model.position.copy(BUDDY.pos); BUDDY.idleT = 0;
}
const _bp = V(0,0,0);
function buddyTick(dt, t){
  const m = BUDDY.model; if(!m) return;
  const hide = LEVEL_ID === 'taxi' || LEVEL_ID === 'bus';
  m.visible = !hide;
  const p = player.position;
  // stand a little behind and to the right of the player; wait when close enough
  _bp.set(p.x - facing.x*.05 - facing.z*.68, p.y, p.z - facing.z*.05 + facing.x*.68);
  if(LEVEL && LEVEL.seated){ _bp.set(p.x + facing.z*.6, p.y + .45, p.z - facing.x*.6); }
  const d = Math.hypot(_bp.x - BUDDY.pos.x, _bp.z - BUDDY.pos.z);
  if(d > 9){ BUDDY.pos.copy(_bp); BUDDY.last.copy(_bp); }
  else if(d > .25){ const k = 1 - Math.exp(-dt*(d > 2.5 ? 6 : 3.2)); BUDDY.pos.x += (_bp.x - BUDDY.pos.x)*k; BUDDY.pos.z += (_bp.z - BUDDY.pos.z)*k; }
  BUDDY.pos.y += (_bp.y - BUDDY.pos.y) * Math.min(1, dt*8);
  const vx = BUDDY.pos.x - BUDDY.last.x, vz = BUDDY.pos.z - BUDDY.last.z, sp = Math.hypot(vx, vz) / Math.max(dt, 1e-3);
  BUDDY.last.copy(BUDDY.pos);
  BUDDY.moving = sp > .35;
  // walk facing the way it goes; when still, the head (and then the body) turns to look at you
  if(BUDDY.moving) BUDDY.yaw = Math.atan2(vx, vz);
  BUDDY.stillT = BUDDY.moving || BUDDY.bubbleT > 0 || S.ui ? 0 : BUDDY.stillT + dt;
  m.position.copy(BUDDY.pos);
  const talking = BUDDY.bubbleT > 0 && BUDDY.el && !BUDDY.el.hidden;
  nekoAnim(m, dt, t, {moving:BUDDY.moving, speed:sp, yaw:BUDDY.yaw, talking, look:camera.position, sleepy:BUDDY.stillT > 24 && BUDDY.face === 'normal'});
  // speech bubble follows the cat on screen
  if(BUDDY.bubbleT > 0){
    BUDDY.bubbleT -= dt;
    const v = _bp.set(m.position.x, m.position.y + 175 * NK3.k + .14, m.position.z).project(camera);
    const r = canvas.getBoundingClientRect();
    const onScreen = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1 && m.visible;
    const x = clamp((v.x*.5 + .5) * r.width, 90, r.width - 90), y = clamp((-v.y*.5 + .5) * r.height, 120, r.height - 120);
    BUDDY.el.style.transform = onScreen ? `translate(${x}px, ${y}px) translate(-50%, -100%)` : `translate(${r.width/2}px, ${r.height*.3}px) translate(-50%, -100%)`;
    if(BUDDY.bubbleT <= 0 || (S.ui && S.ui !== 'finale')) BUDDY.el.hidden = true;
  }
  // a hint when the player seems stuck on the same goal for a while
  if(!S.ui && LEVEL && cam.mode !== 'intro'){
    const obj = LEVEL.objective();
    if(obj !== BUDDY.lastObj){ BUDDY.lastObj = obj; BUDDY.idleT = 0; }
    BUDDY.idleT += dt;
    if(BUDDY.idleT > 38 && !S.done){ BUDDY.idleT = 0; buddySay(`つぎは「${obj}」だにゃ。黄色い ◆ の方へ！`, 'normal', 5200); }
  }else BUDDY.idleT = Math.min(BUDDY.idleT, 30);
}
function setBuddy(who){
  if(!NEKO_NAMES[who] || who === BUDDY.who) return;
  try{ localStorage.setItem('seoulRehearsal.buddy', who); }catch(_){}
  BUDDY.who = who; buddyBuild();
  buddySay('よろしくにゃ！', 'happy', 2200);
}

/* ---------- photos: save / share the 4カット strip and the 漢江 selfie ---------- */
const PHOTOS = {};
const loadImg = u => new Promise(r => { if(!u) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = u; });
function coverDraw(g, img, x, y, w, h){
  if(!img){ g.fillStyle = '#c9ced6'; g.fillRect(x, y, w, h); return; }
  const s = Math.max(w / img.width, h / img.height), sw = w / s, sh = h / s;
  g.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
}
async function photoBlob(kind){
  const P0 = PHOTOS[kind]; if(!P0) return null;
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const font = '"Noto Sans KR","Noto Sans JP",system-ui,sans-serif';
  if(kind === 'fourcut'){
    const imgs = await Promise.all(P0.urls.map(loadImg));
    const W = 720, pad = 36, gap = 22, pw = W - pad*2, ph = Math.round(pw * 3 / 4);
    c.width = W; c.height = pad + 4*ph + 3*gap + 130;
    const bg = {black:'#111111', pink:'#f8c8dc'}[P0.frame] || '#ffffff', ink = P0.frame === 'black' ? '#ffffff' : '#1b2230';
    g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
    imgs.forEach((im, i) => coverDraw(g, im, pad, pad + i*(ph + gap), pw, ph));

  let mag = Math.min(1, Math.hypot(ix, iy));

  if(LEVEL.seated && mag > .3 && LEVEL.standUp) LEVEL.standUp();
  if(LEVEL.seated) mag = 0;

  mv.set(0,0,0);

  while(AUTO.i < path.length && Math.hypot(path[AUTO.i][0] - p.x, path[AUTO.i][1] - p.z) < (AUTO.i === path.length - 1 ? .3 : .45)){ AUTO.i++; AUTO.best = 1e9; AUTO.stuck = 0; }
  if(AUTO.i >= path.length || (AUTO.goalIsTarget && Math.hypot(AUTO.goal[0] - p.x, AUTO.goal[1] - p.z) < 1.25)){ autoStop(); return false; }
  const w = path[AUTO.i], dx = w[0] - p.x, dz = w[1] - p.z, d = Math.hypot(dx, dz);
  // wait at the curb for the green light / for the bike to pass
  if(LEVEL.navWait && LEVEL.navWait(p, w)){ AUTO.stuck = 0; if(!AUTO.waitMsg){ AUTO.waitMsg = true; toast('ちょっと待ってね', LEVEL_ID === 'myeongdong' ? '信号が青になるまで待とう' : '自転車が通りすぎるまで待とう', 1600); } return false; }
  AUTO.waitMsg = false;
  if(d < AUTO.best - .05){ AUTO.best = d; AUTO.stuck = 0; } else if((AUTO.stuck += dt) > 1.6){ autoStop(); toast('ここから先は、スティックで歩いてね', '', 1600); return false; }
  out.set(dx / d, 0, dz / d);
  // the camera turns gently to look where we walk
  if(cam.mode === 'third') cam.yawT = Math.atan2(-out.x, -out.z);
  return true;
}

const tapDown = new Map(), _tray = new THREE.Raycaster(), _tplane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), _thit = V(0, 0, 0);

    ${PHOTOS.fourcut || PHOTOS.selfie ? `<div class="btn-row">${PHOTOS.fourcut ? '<button class="btn ghost" type="button" data-act="sharePhoto" data-k="fourcut">4カット写真を保存</button>' : ''}${PHOTOS.selfie ? '<button class="btn ghost" type="button" data-act="sharePhoto" data-k="selfie">漢江セルカを保存</button>' : ''}</div>` : ''}
    <div class="btn-row"><button class="btn" type="button" data-act="restart">別のルートで最初から</button>${IN_TOREKAN ? '<a class="btn ghost" href="../../#/trip3d">トレ韓で旅カードを見る</a>' : ''}</div>
    <div class="note">空間・動線は実際の場所を参考に簡略化しています。料金・レート・支払い方法の一部はゲーム内の設定です。</div>`);
  say('오늘 하루 수고했어요!'); buddyFace('happy', 8000);
}

/* ---------- hide signs / stalls that block the view ---------- */
const _fb = new THREE.Box3(), _fr = new THREE.Ray(), _fp = V(0,0,0);
function fadeTick(){
  if(!FADE.length) return;
  const first = cam.mode === 'first' || cam.mode === 'intro';
  _fp.copy(camera.position).sub(head); const dist = _fp.length(); _fr.set(head, _fp.normalize());
  for(const o of FADE){
    if(!o.userData.box){ o.updateMatrixWorld(true); o.userData.box = new THREE.Box3().setFromObject(o).expandByScalar(.25); }
    const b = o.userData.box;
    let hide = false;
    if(!first){ if(b.containsPoint(camera.position) || b.distanceToPoint(camera.position) < 3.0) hide = true; else { const hit = _fr.intersectBox(b, _fb.min); if(hit && hit.distanceTo(head) < dist + .2 && !b.containsPoint(head)) hide = true; } }
    else if(cam.mode === 'first' && b.containsPoint(camera.position)) hide = true;
    o.visible = !hide;
  }
}
/* ---------- loop ---------- */
const tmp = V(0,0,0), head = V(0,0,0), camWant = V(0,0,0), camLook = V(0,0,0), ray = new THREE.Raycaster(), dirV = V(0,0,0);
const DTMAX = DEBUG ? .3 : .05;
let last = performance.now(), clock = 0;
function step(now){
  const dt = Math.min(DTMAX, (now - last) / 1000); last = now; clock += dt;
  if(LEVEL && LR){
    const sp = movePlayer(dt);
    facing.lerp(wantFace, 1 - Math.exp(-dt*9)).normalize();
    player.rotation.y = Math.atan2(facing.x, facing.z);
    animHuman(player, dt, sp, clock);
    const w = player.userData.walk;
    suitcase.position.set(.24 + (1-w)*.2, 0, -.72*w + (1-w)*-.12);
    suitcase.rotation.x = .54*w + (1-w)*.02;
    LEVEL.update && LEVEL.update(dt, clock);
    updateSpot();
    if((clock * 10 | 0) !== (step.k | 0)){ step.k = clock * 10 | 0; autoUI(); }
    updateNPCs(dt, clock);
    fxTick(dt);
    // marker
    const tgt = !S.ui && LEVEL.target ? LEVEL.target() : null;
    marker.visible = !!tgt && cam.mode !== 'intro';
    if(tgt){ marker.position.set(tgt[0], tgt[1] + 2.3 + Math.sin(clock*3)*.12, tgt[2]); marker.children[0].rotation.y += dt*2; const dd = Math.hypot(tgt[0] - player.position.x, tgt[2] - player.position.z); marker.children[0].material.opacity = clamp((dd - 1.2) / 3, 0, .9); marker.userData.ring.material.opacity = marker.children[0].material.opacity * .5; }
    key.position.copy(player.position).add(keyOffset); key.target.position.copy(player.position);
    // camera
    if(cam.yawT != null){ let d = cam.yawT - cam.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); cam.yaw += d * Math.min(1, dt*4); }
    cam.dist += (cam.distT - cam.dist) * Math.min(1, dt*6);
    const sc = player.userData.sc, sitting = player.userData.pose === 'sit';
    head.copy(player.position); head.y += (sitting ? 1.05 : 1.45)*sc;
    player.visible = cam.mode !== 'first';
    if(cam.mode === 'intro' && LEVEL.introCam){
      cam.introT += dt; const ic = LEVEL.introCam, a = cam.introT * .05;
      camWant.copy(ic.pos).add(V(Math.sin(a)*1.5, Math.sin(a*.7)*.3, Math.cos(a)*1.5 - 1.5));
      camera.position.lerp(camWant, 1 - Math.exp(-dt*2)); camLook.lerp(ic.look, 1 - Math.exp(-dt*2)); camera.lookAt(camLook);
    }else if(cam.mode === 'first'){
      camera.position.set(player.position.x + facing.x*.12, player.position.y + (sitting ? 1.12 : 1.56)*sc, player.position.z + facing.z*.12);
      tmp.set(-Math.sin(cam.yaw)*Math.cos(cam.fpPitch), Math.sin(cam.fpPitch), -Math.cos(cam.yaw)*Math.cos(cam.fpPitch));
      camera.lookAt(tmp.add(camera.position));
    }else{
      const top = cam.mode === 'top';
      const pitch = top ? 1.22 : cam.pitch, dist = top ? Math.max(cam.dist, 13) : cam.dist;
      dirV.set(Math.sin(cam.yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(cam.yaw)*Math.cos(pitch));
      let dd = dist;
      if(!top && occluders.length){ ray.set(head, dirV); ray.far = dist; const hit = ray.intersectObjects(occluders, false)[0]; if(hit) dd = Math.max(.45, hit.distance - .25); }
      camWant.copy(head).addScaledVector(dirV, dd);
      if(!top){ const ceil = LEVEL.ceil ? LEVEL.ceil(camWant.x, camWant.z) : 60; camWant.y = Math.min(camWant.y, ceil); camWant.y = Math.max(camWant.y, (LEVEL.floorY ? LEVEL.floorY(camWant.x, camWant.z) : player.position.y) + .25); }
      camera.position.lerp(camWant, 1 - Math.exp(-dt*12));
      camLook.copy(head); camera.lookAt(camLook);
    }
    sky.position.copy(camera.position);
    camera.updateMatrixWorld();
    fadeTick();
    buddyTick(dt, clock);
    drawMap();
    perfTick(dt);
    if(gradePass) gradePass.uniforms.uTime.value = clock % 100;
    reflUpdate();
  }
  composer.render(dt);
  if(CAPTURE.q.length){ const q = CAPTURE.q.splice(0); let url = null; try{ url = canvas.toDataURL('image/jpeg', .82); }catch(_){} for(const cb of q) cb(url); }
  requestAnimationFrame(step);
}
function resize(){
  const [w, h] = viewSize();
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < .8 ? 64 : 52; camera.updateProjectionMatrix();
  if(composer) composer.setSize(w, h);
}
addEventListener('resize', resize);

/* ---------- boot ---------- */
async function boot(){
  try{ await Promise.race([Promise.all([document.fonts.load(`700 40px "Noto Sans KR"`, '공항철도'), document.fonts.load(`800 40px "M PLUS Rounded 1c"`, '空港鉄道')]), new Promise(r => setTimeout(r, 2500))]); }catch(_){}
  setQuality(QMODE, false);
  resize();
  buddyInit();
  if(IN_TOREKAN){
    $('toTorekan').hidden = false;
    // back to トレ韓 from anywhere in the game (asks first; the progress is kept for 「つづきから」)
    const ask = $('exitAsk'); $('exitBtn').hidden = false;
    $('exitBtn').addEventListener('click', () => { ask.hidden = false; $('exitNo').focus(); });
    $('exitNo').addEventListener('click', () => { ask.hidden = true; });
    ask.addEventListener('click', e => { if(e.target === ask) ask.hidden = true; });
    $('exitYes').addEventListener('click', () => { if(LEVEL && !S.done && cam.mode !== 'intro') save(); bridgeSave(); location.href = '../../#/trip3d'; });
    addEventListener('keydown', e => { if(e.key === 'Escape' && !ask.hidden){ ask.hidden = true; e.stopPropagation(); } }, true);
  }
  const sv = loadSave(); BOOT_SAVE = sv && sv.level && sv.level !== 'airport' ? sv : null;
  goLevel('airport', false, !!BOOT_SAVE);
  if(BOOT_SAVE){
    setTimeout(() => {
      const path = PATHS[sv.s.path || 'train'], idx = path.indexOf(keyOf(sv.level));
      showSheet(`<div class="eyebrow">ソウル旅リハーサル</div><h2>続きから遊びますか？</h2><p>前回は「SCENE ${idx + 1} · ${esc(NAMES[keyOf(sv.level)] || '')}」まで進んでいます。</p><div class="btn-row"><button class="btn" type="button" data-act="continue">続きから</button><button class="btn ghost" type="button" data-act="restart">最初から</button></div>`);
    }, 520);
  }
  requestAnimationFrame(t => { last = t; step(t); });
}
if(DEBUG) window.__dbg = {S, cam, go:goLevel, pos:()=>player.position.toArray(), campos:()=>camera.position.toArray(), tp:(x,y,z,lvl)=>{ player.position.set(x,y,z); if(lvl) S.lvl = lvl; }, L:()=>LEVEL, info:()=>renderer.info.render, q:()=>QS.key, setQ:setQuality, npcs:()=>npcs.length, calls:()=> new Promise(r => { renderer.info.autoReset = false; renderer.info.reset(); requestAnimationFrame(() => requestAnimationFrame(() => { const c = {calls:renderer.info.render.calls, tris:renderer.info.render.triangles, geo:renderer.info.memory.geometries, tex:renderer.info.memory.textures}; renderer.info.autoReset = true; r(c); })); }), THREE, scene, camera, renderer, player, LEVELS, DLG, PANELS, openDialog, openPanel, fail, closeUI, choose, panelPress, quizPick, routeQuiz, spots:()=>spotList, curSpot:()=>curSpot, BUDDY, buddyFace, buddySay, VOICE, speakKo, finale:()=>finaleSheet(), PHOTOS, AUTO, autoGo, autoPath, SFX, act:()=>{ if(curSpot && !S.ui){ const s = curSpot; curSpot = null; s.run(); } }};
boot();
</script>
